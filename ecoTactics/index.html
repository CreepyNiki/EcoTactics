<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <title>EcoTactics</title>
    <link rel="stylesheet" href="src/style.css"/>
    <link rel="icon" href="assets/favicon.png"/>
    <script src="src/main.js" defer></script>
</head>
<body>

<div class="logDropdown">
    <div class="log" id="log"></div>
</div>

    <header>
        <img class="logo" src="assets/logo_green.png" alt="EcoTactics Logo"/>
        <div class="day"></div>
        <div class="populationCounter">
            <img class="populationIcon" src="assets/population.png" alt="populationIcon"/>
            <p class="population"></p>
        </div>
    </header>

    <div class="canvas">
        <img class="backgroundImage" src="assets/background_image.png" alt="backgroundImage"/>
    </div>

    <input type="image" src="assets/log.png" class="logButton" alt="logButton"/>

    <div class="statusCard">
        <div class="stat">
            <div class="bar">
                <div class="moneyCounter"></div>
                <div class="moneyBar"></div>
            </div>
            <img class="moneyIcon" src="assets/money.png" alt="moneyIcon"/>
        </div>
        <div class="stat">
            <div class="bar">
                <div class="happinessCounter"></div>
                <div class="happinessBar"></div>
            </div>
            <img class="happinessIcon" src="assets/happiness.png" alt="happinessIcon"/>
        </div>
        <div class="stat">
            <div class="bar">
                <div class="envCounter"></div>
                <div class="envBar"></div>
            </div>
            <img class="envIcon" src="assets/env.png" alt="envIcon"/>
        </div>
    </div>

    <div class="selection">
        <div class="upperSelectionRow">
        <div class="selectHeader"> Wähle eine Aktion:</div>
        <button class="resetButton">Neustart</button>
        </div>
        <div class="actions">
        </div>

    </div>
    <footer>
        <div class="footer">
            <p class="footerText">EcoTactics von Senem und Niklas</p>
            <a href="https://github.com/CreepyNiki/EcoTactics"><img class="gitHubIcon" src="assets/github-brands-solid.svg" alt="Link zum GithubRepo"></a>
        </div>
    </footer>
</body>
</html>
