<!-- Website zu großen Teilen auf einem 24 Zoll Monitor erstellt. Auf kleineren Bildschirmen kann es zu Darstellungsproblemen kommen. -->
<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EcoTactics</title>
    <link rel="stylesheet" href="src/style4.css"/>
    <link rel="icon" href="assets/favicon.png"/>
    <script src="src/main.js" defer></script>
</head>
<body>

<!-- Logs -->
<div class="logDropdown">
    <div class="log"></div>
</div>

<!-- Header -->
    <header>
       <a href="index.html"><img class="logo" src="assets/logo_green.png" alt="EcoTactics Logo"/></a>
        <div class="day"></div>
        <div class="headerRight">
            <div class="populationCounter">
                <img class="populationIcon" src="assets/population.png" alt="populationIcon"/>
                <p class="population"></p>
            </div>
            <div class="passiveCostsDisplay">
                <span class="passiveCostsLabel">vorraussichtliche Kosten/Tag:</span>
                <span class="passiveCostsCounter"></span>
            </div>
        </div>
    </header>

<!-- Main Page -->
    <div class="canvas">
        <!-- News Ticker -->
        <div class="newsTicker">
            <marquee behavior="scroll" direction="left" scrollamount="8" class="newsText">
                Willkommen zu EcoTactics! Baue deine Stadt nachhaltig und halte deine Bürger glücklich!
            </marquee>
        </div>
        <!-- Karte -->
        <div class="mapContainer">
            <img class="backgroundImage" src="assets/Maps/map.png" alt="backgroundImage"/>
        </div>
    </div>

    <input type="image" src="assets/log.png" class="logButton" alt="logButton"/>

    <!-- Ressourcenanzeige -->
    <div class="statusCard">
        <div class="stat">
            <div class="bar">
                <div class="moneyCounter"></div>
                <div class="moneyBar"></div>
            </div>
            <img class="moneyIcon" src="assets/money.png" alt="moneyIcon"/>
        </div>
        <div class="stat">
            <div class="bar">
                <div class="happinessCounter"></div>
                <div class="happinessBar"></div>
            </div>
            <img class="happinessIcon" src="assets/happiness.png" alt="happinessIcon"/>
        </div>
        <div class="stat">
            <div class="bar env">
                <div class="envCounter"></div>
                <div class="envBar"></div>
                <div class="envDropdown"></div>
            </div>
            <img class="envIcon" src="assets/environment.png" alt="envIcon"/>
        </div>
    </div>

<!-- Reset Button -->
<img class="resetButton" src="assets/reset.png" alt="shopIcon"/>

<!-- Aktionsauswahl -->
    <div class="selection">
        <div class="upperSelectionRow">
            <div class="selectHeader">Wähle eine Aktion:</div>
        </div>
        <div class="actions">
        </div>

        <!-- Shop Button -->
        <div class="shopButton">
            <img class="shopIcon" src="assets/shop.png" alt="shopIcon"/>
            <p class="shopParagraph">Shop</p>
        </div>

    </div>

<!-- Shop -->
    <div class="shop" id="shopModal">
        <div class="shop-container">
            <div class="shop-header">
                <h2 class="shop-title">Gebäude Shop</h2>
                <button class="shop-close">✕</button>
            </div>
            <div class="shop-content">
            </div>
            <div class="shop-footer">
                <div class="shop-resources">
                    <div class="shop-resource">
                        <img src="assets/money.png" alt="Geld" class="resource-icon">
                        <span class="resource-value" id="shopMoneyValue"></span>
                    </div>
                    <div class="shop-resource">
                        <img src="assets/happiness.png" alt="Zufriedenheit" class="resource-icon">
                        <span class="resource-value" id="shopHappinessValue"></span>
                    </div>
                    <div class="shop-resource">
                        <img src="assets/environment.png" alt="Umwelt" class="resource-icon">
                        <span class="resource-value" id="shopEnvValue"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

<!-- Footer -->
    <footer>
        <div class="footer">
            <p class="footerText">EcoTactics von Senem und Niklas</p>
            <a href="https://github.com/CreepyNiki/EcoTactics"><img class="gitHubIcon" src="assets/githubLogo.svg" alt="Link zum GithubRepo"></a>
    </div>
    </footer>
</body>
</html>
